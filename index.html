<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ghostboard 幽灵灵感板，把灵光一闪变成完成的作品。"><title>Ghostboard · 幽灵灵感板</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="sidebar"><a class="brand" href="./"><span class="ghost">◕</span> GHOSTBOARD<span class="edition">CREATOR'S EDITION / 01</span></a><p class="nav-caption">你的创作空间</p><a class="nav active" href="#board">▦ &nbsp; 灵感工作台</a><div class="sidebar-bottom"><span class="status-dot"></span> 本地优先 · 无需账号<p>灵感不会消失，<br>它们只是在等你唤醒。</p><small>数据仅保存在当前浏览器。<br>定期导出，留住每个好点子。</small></div></aside>
<main id="board"><header><span>WORKSPACE / 我的工作台</span><div class="tools"><button id="import">导入备份</button><button id="backup">备份 JSON</button><button id="export">导出 Markdown ↗</button><input id="file" type="file" accept="application/json,.json" hidden></div></header>
<section class="intro"><div><p class="eyebrow">MAKE SOMETHING COME ALIVE</p><h1>唤醒你的<span>下一个灵感。</span></h1><p class="subtitle">收集脑洞，慢慢酝酿，让好点子真正成为作品。</p></div><button class="primary" id="new">＋ 收集新灵感</button></section>
<section class="stats" aria-label="创作统计"><div><span>灵感收藏</span><strong id="total">0</strong><small>每个想法都值得被记录</small></div><div><span>正在酝酿</span><strong id="brewing-count">0</strong><small>给创作一点生长的时间</small></div><div><span>已经唤醒</span><strong id="alive-count">0</strong><small>完成比完美更重要</small></div><div class="prompt"><span>✦ 今日脑洞</span><p id="prompt"></p><button id="shuffle">换一个灵感 ↻</button></div></section>
<section class="board-tools"><div class="filters" role="group" aria-label="按类型筛选"><button data-kind="all" class="selected" aria-pressed="true">全部灵感</button><button data-kind="video" aria-pressed="false">视频</button><button data-kind="code" aria-pressed="false">代码</button><button data-kind="writing" aria-pressed="false">写作</button></div><input id="search" type="search" placeholder="搜索你的灵感…" aria-label="搜索灵感"></section>
<div id="columns" class="columns"></div><p class="footnote">一个想法，一小步。今天也让创作向前一点。</p><p id="notice" role="status" aria-live="polite"></p>
</main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="dialog-title">收集新灵感</h2><button type="button" id="close" aria-label="关闭">×</button></div><label>灵感标题<input name="title" required maxlength="100" placeholder="你想让什么变成现实？"></label><div class="form-row"><label>创作类型<select name="kind"><option value="video">视频</option><option value="code">代码</option><option value="writing">写作</option></select></label><label>当前状态<select name="stage"><option value="spark">灵光一闪</option><option value="brewing">正在酝酿</option><option value="alive">已经唤醒</option></select></label></div><label>创作笔记<textarea name="note" rows="6" maxlength="3000" placeholder="记下画面、步骤和任何不想忘记的细节…"></textarea></label><div class="dialog-actions"><button type="button" id="delete" class="danger">删除灵感</button><button class="primary" type="submit">保存灵感 ↗</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
